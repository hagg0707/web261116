
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 보드</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <a class="logo" href="index.html">내 영화 보드</a>

    <nav>
        <a href="#mine">내 영화</a>
        <a href="#board">영화 목록</a>
        <a href="#footer">사이트 정보</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <p class="eyebrow">MY MOVIE COLLECTION</p>
        <h1>내 영화 보드</h1>
        <p>내가 좋아하는 영화들을 한곳에서 확인하고 정렬할 수 있는 영화 보드입니다.</p>
        <a class="hero-link" href="#mine">영화 보러 가기 ↓</a>
    </div>
</section>

<main>

    <section id="mine" class="movie-section">

        <div class="section-heading">
            <div>
                <h2>다시 보고 싶은 영화</h2>
                <p>자바스크립트로 영화 카드를 자동으로 생성합니다.</p>
            </div>
        </div>

        <!-- 영화 개수와 정렬 선택 -->
        <div class="toolbar">

            <p id="count">0편</p>

            <div class="sort-box">
                <label for="sort">정렬</label>

                <select id="sort" onchange="applySort()">
                    <option value="rating">평점순</option>
                    <option value="year">최신 개봉순</option>
                    <option value="title">제목순</option>
                </select>
            </div>

        </div>

        <!-- 자바스크립트로 영화 카드 생성 -->
        <section class="board" id="board">
        </section>

    </section>

</main>

<footer id="footer">
    <p>이 사이트는 TMDB 영화 데이터를 활용합니다.</p>
    <p>TMDB의 보증이나 인증을 받지 않았습니다.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
